version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  video_player: ^2.10.0
  chewie: ^1.8.1
  go_router: ^14.2.0
  riverpod: ^2.5.1
